name: MsMessenger
options:
  bundleIdPrefix: com.ms
  deploymentTarget:
    iOS: "16.0"

settings:
  SWIFT_VERSION: "5.0"
  SWIFT_STRICT_CONCURRENCY: minimal
  TARGETED_DEVICE_FAMILY: "1,2"

targets:
  MsMessenger:
    type: application
    platform: iOS
    sources:
      - path: MsMessenger
    info:
      path: MsMessenger/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ms.messenger
      INFOPLIST_FILE: MsMessenger/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      DEVELOPMENT_TEAM: ""
    dependencies:
      - sdk: AuthenticationServices.framework
      - sdk: CryptoKit.framework
      - sdk: UIKit.framework
    scheme:
      testTargets:
        - MsMessengerUITests

  MsMessengerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MsMessengerUITests
    dependencies:
      - target: MsMessenger
