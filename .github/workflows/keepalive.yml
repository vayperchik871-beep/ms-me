name: keepalive
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -s --max-time 60 -o /dev/null -w "%{http_code}\n" https://ms-messenger-server.onrender.com/health && sleep 5 && curl -s --max-time 60 -o /dev/null -w "%{http_code}\n" https://ms-messenger-server.onrender.com/health
