name: Keepalive

on:
  schedule:
    - cron: '*/9 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render server
        run: |
          for i in 1 2 3; do
            curl -s https://ms-messenger-server.onrender.com/health && break
            sleep 30
          done
