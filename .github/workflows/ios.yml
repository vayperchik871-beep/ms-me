name: iOS Build

on:
  push:
    branches: [ main ]
    paths: [ 'ios/**', '.github/workflows/ios.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen & generate .xcodeproj
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for Simulator
        run: |
          set -e
          xcodebuild build \
            -project MsMessenger.xcodeproj \
            -scheme MsMessenger \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
          echo "=== Build products ==="
          find build/Build/Products -name "*.app" -type d | head -5

      - name: Package Simulator
        if: success()
        run: |
          set -e
          cd build/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/MsMessenger-Simulator.zip" MsMessenger.app

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MsMessenger-Simulator
          path: MsMessenger-Simulator.zip
          retention-days: 14

      - name: Build for Device
        if: success()
        run: |
          rm -rf build
          xcodebuild build \
            -project MsMessenger.xcodeproj \
            -scheme MsMessenger \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          echo "=== Device build products ==="
          find build/Build/Products -name "*.app" -type d | head -5

      - name: Package IPA
        if: success()
        run: |
          set -e
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MsMessenger.app Payload/
          zip -r "$GITHUB_WORKSPACE/MsMessenger.ipa" Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MsMessenger-IPA
          path: MsMessenger.ipa
          retention-days: 14
