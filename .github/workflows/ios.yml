name: iOS Build

on:
  push:
    branches: [ main ]
    paths: [ 'ios/**', '.github/workflows/ios.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen & generate .xcodeproj
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project MsMessenger.xcodeproj \
            -scheme MsMessenger \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            grep -E "error:" build.log | head -30 > errors.txt
            while IFS= read -r line; do echo "::error::$line"; done < errors.txt
            grep -E "error:" build.log | head -30
            echo "BUILD_RESULT=failed" >> "$GITHUB_ENV"
            exit 1
          fi
          echo "BUILD_RESULT=ok" >> "$GITHUB_ENV"
          echo "=== Build products ==="
          find build/Build/Products -name "*.app" -type d | head -5

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ios/build.log
          retention-days: 7

      - name: Package Simulator
        if: success()
        run: |
          set -e
          find build/Build/Products -name "MsMessenger.app" -type d -maxdepth 2 | head -1 | xargs -I{} zip -r "$GITHUB_WORKSPACE/MsMessenger-Simulator.zip" {}

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MsMessenger-Simulator
          path: MsMessenger-Simulator.zip
          retention-days: 14

      - name: Simulator Screenshots
        if: success()
        run: |
          set -e
          APP=$(find build/Build/Products -name "MsMessenger.app" -type d -maxdepth 2 | head -1)
          echo "App: $APP"
          DEVICE=$(xcrun simctl list devices available -j | python3 -c \
            "import json,sys; d=json.load(sys.stdin)['devices']; devs=[x for k in d for x in d[k] if x['isAvailable'] and 'iPhone 17 Pro' in x['name'] and 'iOS-26-2' in k]; print(devs[0]['udid'])")
          echo "Device: $DEVICE"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.ms.messenger
          sleep 15
          mkdir -p "$GITHUB_WORKSPACE/ios-screenshots"
          xcrun simctl io "$DEVICE" screenshot "$GITHUB_WORKSPACE/ios-screenshots/launch.png"
          sleep 3
          xcrun simctl io "$DEVICE" screenshot "$GITHUB_WORKSPACE/ios-screenshots/3s-later.png"
          xcrun simctl shutdown "$DEVICE" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: iOS-Screenshots
          path: ios-screenshots
          retention-days: 14

      - name: Full Review Video
        if: success()
        run: |
          set -e
          DEVICE=$(xcrun simctl list devices available -j | python3 -c \
            "import json,sys; d=json.load(sys.stdin)['devices']; devs=[x for k in d for x in d[k] if x['isAvailable'] and 'iPhone 17 Pro' in x['name'] and 'iOS-26-2' in k]; print(devs[0]['udid'])")
          echo "Device: $DEVICE"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP=$(find build/Build/Products -name "MsMessenger.app" -type d -maxdepth 2 | head -1)
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.ms.messenger
          sleep 12
          mkdir -p "$GITHUB_WORKSPACE/ios-video"
          xcrun simctl io "$DEVICE" recordVideo --codec h264 --force "$GITHUB_WORKSPACE/ios-video/review.mp4" &
          REC_PID=$!
          TEST_STATUS=0
          xcodebuild test \
            -project MsMessenger.xcodeproj \
            -scheme MsMessenger \
            -destination "id=$DEVICE" \
            -derivedDataPath build \
            -only-testing:MsMessengerUITests/FullReviewTests/testFullReview \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ui-test.log || TEST_STATUS=${PIPESTATUS[0]}
          sleep 3
          kill -INT $REC_PID 2>/dev/null || true
          for i in $(seq 1 10); do
            if ! kill -0 $REC_PID 2>/dev/null; then break; fi
            sleep 1
          done
          kill -9 $REC_PID 2>/dev/null || true
          xcrun simctl shutdown "$DEVICE" 2>/dev/null || true
          echo "=== ui-test.log tail ==="
          tail -60 ui-test.log || true
          grep -E "error:|Testing failed|failed|Test Case '.*' (passed|failed)" ui-test.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done || true
          echo "TEST_STATUS=$TEST_STATUS"
          ls -la "$GITHUB_WORKSPACE/ios-video"
          echo "=== Crash reports ==="
          mkdir -p "$GITHUB_WORKSPACE/crash-reports"
          cp ~/Library/Logs/DiagnosticReports/*.ips "$GITHUB_WORKSPACE/crash-reports/" 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/*.crash "$GITHUB_WORKSPACE/crash-reports/" 2>/dev/null || true
          echo "=== App log (last 6m) ==="
          xcrun simctl spawn "$DEVICE" log show --last 6m --predicate 'process == "MsMessenger"' --style compact 2>/dev/null | grep -iE "fatal|error|crash|exception|abort|signal|uncaught|precondition|trapped" | head -40 | while IFS= read -r line; do echo "::error::$line"; done || true
          ls -la "$GITHUB_WORKSPACE/crash-reports" || true
          for f in "$GITHUB_WORKSPACE"/crash-reports/*; do
            if [ -f "$f" ]; then
              echo "=== Crash file: $f ==="
              head -c 3000 "$f"
              echo ""
              python3 - "$f" <<'PYEOF'
import json, sys, re
path = sys.argv[1]
raw = open(path, encoding='utf-8', errors='replace').read()
body = raw[raw.find('\n{')+1:] if '\n{' in raw else raw
try:
    data = json.loads(body)
    print(f"proc: {data.get('procName') or data.get('proc') or '?'} pid={data.get('pid')}")
    print(f"appinfo: {data.get('appinfo')}")
    print(f"exception: {data.get('exception')} termination: {data.get('termination')}")
    asi = data.get('asi') or data.get('applicationSpecificInformation')
    if asi: print(f"asi: {asi}")
except Exception as e:
    print("parse failed:", e)
    m = re.search(r'Terminating app[^\n]{0,400}', raw)
    if m: print(m.group(0))
    m2 = re.search(r'Exception Type[^\n]*|Exception Codes[^\n]*|Termination Reason[^\n]*', raw)
    if m2: print(m2.group(0))
PYEOF
              python3 - "$f" <<'PYEOF' | while IFS= read -r line; do echo "::error::$line"; done || true
import json, sys
path = sys.argv[1]
raw = open(path, encoding='utf-8', errors='replace').read()
body = raw[raw.find('\n{')+1:] if '\n{' in raw else raw
try:
    data = json.loads(body)
    proc = data.get('procName') or '?'
    exc = data.get('exception') or {}
    term = data.get('termination') or {}
    asi = data.get('asi') or data.get('applicationSpecificInformation') or {}
    print(f"CRASH proc={proc} exception={exc.get('type')} signal={exc.get('signal')} term={term.get('indicator')} reason={term.get('reason')} asi={asi.get('message', '')[:400]}")
except Exception:
    pass
PYEOF
            fi
          done
          test -s "$GITHUB_WORKSPACE/ios-video/review.mp4"
          exit $TEST_STATUS

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: iOS-Video
          path: ios-video
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-log
          path: ios/ui-test.log
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crash-reports
          path: crash-reports
          retention-days: 7
          if-no-files-found: ignore

      - name: Build for Device
        if: success()
        run: |
          rm -rf build
          xcodebuild build \
            -project MsMessenger.xcodeproj \
            -scheme MsMessenger \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          echo "=== Device build products ==="
          find build/Build/Products -name "*.app" -type d | head -5

      - name: Package IPA
        if: success()
        run: |
          set -e
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MsMessenger.app Payload/
          zip -r "$GITHUB_WORKSPACE/MsMessenger.ipa" Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MsMessenger-IPA
          path: MsMessenger.ipa
          retention-days: 14
