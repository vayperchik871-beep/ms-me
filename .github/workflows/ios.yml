name: iOS Build

on:
  push:
    branches: [ main ]
    paths: [ 'ios/**', '.github/workflows/ios.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen & generate .xcodeproj
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project MsMessenger.xcodeproj \
            -scheme MsMessenger \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== ERRORS ==="
            grep -E "error:|warning:|BUILD FAILED" build.log | head -50
            exit 1
          fi
          echo "=== Build products ==="
          find build/Build/Products -name "*.app" -type d | head -5

      - name: Package Simulator
        if: success()
        run: |
          set -e
          find build/Build/Products -name "MsMessenger.app" -type d -maxdepth 2 | head -1 | xargs -I{} zip -r "$GITHUB_WORKSPACE/MsMessenger-Simulator.zip" {}

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MsMessenger-Simulator
          path: MsMessenger-Simulator.zip
          retention-days: 14

      - name: Build for Device
        if: success()
        run: |
          rm -rf build
          xcodebuild build \
            -project MsMessenger.xcodeproj \
            -scheme MsMessenger \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          echo "=== Device build products ==="
          find build/Build/Products -name "*.app" -type d | head -5

      - name: Package IPA
        if: success()
        run: |
          set -e
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MsMessenger.app Payload/
          zip -r "$GITHUB_WORKSPACE/MsMessenger.ipa" Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MsMessenger-IPA
          path: MsMessenger.ipa
          retention-days: 14
