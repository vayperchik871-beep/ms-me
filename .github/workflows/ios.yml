name: iOS Build

on:
  push:
    branches: [ main ]
    paths: [ 'ios/**', '.github/workflows/ios.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app

      - name: Install XcodeGen & generate .xcodeproj
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for Simulator
        run: |
          set -e
          xcodebuild build \
            -project MsMessenger.xcodeproj \
            -scheme MsMessenger \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO
          echo "=== Build products ==="
          find build/Build/Products -name "*.app" -type d
          test -d build/Build/Products/Debug-iphonesimulator/MsMessenger.app

      - name: Package Simulator app
        run: |
          set -e
          cd build/Build/Products/Debug-iphonesimulator
          zip -r /tmp/MsMessenger-Simulator.zip MsMessenger.app
          ls -lh /tmp/MsMessenger-Simulator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MsMessenger-Simulator
          path: /tmp/MsMessenger-Simulator.zip
          retention-days: 14

      - name: Build for Device
        run: |
          rm -rf build
          xcodebuild build \
            -project MsMessenger.xcodeproj \
            -scheme MsMessenger \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO
          echo "=== Device build products ==="
          find build/Build/Products -name "*.app" -type d

      - name: Package as IPA
        run: |
          set -e
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MsMessenger.app Payload/
          zip -r /tmp/MsMessenger.ipa Payload
          rm -rf Payload
          ls -lh /tmp/MsMessenger.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MsMessenger-IPA
          path: /tmp/MsMessenger.ipa
          retention-days: 14
