name: iOS Build

on:
  push:
    branches: [ main ]
    paths: [ 'ios/**', '.github/workflows/ios.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen & generate .xcodeproj
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project MsMessenger.xcodeproj \
            -scheme MsMessenger \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/build-log.txt
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            ERRORS=$(grep -i "error:" /tmp/build-log.txt | head -30 || true)
            echo "### Build Errors" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$ERRORS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build-log.txt
          retention-days: 7

      - name: Package Simulator app
        if: success()
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r MsMessenger.zip MsMessenger.app

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MsMessenger-iOS-Simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/MsMessenger.zip
          retention-days: 14

      - name: Build for Device (unsigned IPA)
        if: success()
        run: |
          rm -rf build
          xcodebuild build \
            -project MsMessenger.xcodeproj \
            -scheme MsMessenger \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            2>&1 | tee /tmp/device-build-log.txt
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "### Device Build Errors" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -i "error:" /tmp/device-build-log.txt | head -30 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "Device build failed (expected without signing). Simulator build succeeded." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MsMessenger.app Payload/
          zip -r MsMessenger.ipa Payload
          rm -rf Payload
          cp MsMessenger.ipa ../MsMessenger.ipa

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MsMessenger-iOS-IPA
          path: ios/MsMessenger.ipa
          retention-days: 14
